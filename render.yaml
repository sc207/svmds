# Render Blueprint — Shri Vihat Meldi Dham, Sanand (Phase 1: Mahotsav sevarthi & contributions)
# New → Blueprint → pick this repo. Fill the `sync: false` vars in the dashboard.
#
# DATA-SAFETY POLICY — build and start must ONLY install deps and start the
# server. Never put any of these in buildCommand / startCommand:
#   npm run reset · npm run seed:demo · node server/db/seed/seed-dummy.js
# The server's own boot runs forward-only migrations (p1_migrations) and
# idempotent invariant repairs that never delete rows. (Production was moved
# from the old portal to Phase 1 on 2026-09-24 by a one-time cutover.)
services:
  - type: web
    name: svmds
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install          # deps only — never a data script
    startCommand: node server/index.js  # server boot: migrate + idempotent seed, no deletes
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_NAME
        value: Shri Vihat Meldi Dham — Sanand
      # The mandir works in India time; SQL uses the same fixed +05:30.
      - key: TZ
        value: Asia/Kolkata
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
