  <!-- KPI icons. A figure's mark should say which figure it is without
       the label: a person with a tick for people signed up, a wallet
       for money actually in hand, a target for the amount aimed at,
       and a rising line for anything above it. -->

  <symbol id="user-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
