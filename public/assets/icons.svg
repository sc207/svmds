<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Icon sprite. Use as: <svg class="ico"><use href="/assets/icons.svg#name"/></svg>
       All strokes inherit currentColor; 24x24 grid. -->

  <symbol id="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
