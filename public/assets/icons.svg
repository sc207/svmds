  <!-- A yagna is a fire ritual, so the Maha Yagna category is a flame.
       This symbol was removed once as "defined but never referenced":
       the reference is in server/routes/poojas.js CATEGORIES, so the
       name arrives from the API and no scan of public/ could see it.
       The Maha Yagna card had an empty disc from then until now. -->
